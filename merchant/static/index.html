<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SecurePay — Demo Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    *{box-sizing:border-box} body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:18px;background:#fafafa}
    .container{max-width:980px;margin:0 auto}.row{display:flex;gap:8px;align-items:center}.grid{display:flex;gap:12px;flex-wrap:wrap}
    .card{border:1px solid #e0e0e0;padding:12px;border-radius:8px;width:220px;background:#fff}.hidden{display:none!important}
    button{background:#0066cc;color:#fff;border:0;padding:9px 12px;border-radius:6px;cursor:pointer} button.secondary{background:#e6eefc;color:#003366}
    button:disabled{opacity:.6} input,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px;font:inherit}
    table{width:100%;border-collapse:collapse;margin-top:8px;background:#fff} td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}.right{text-align:right}
    .checkout-box{background:#fff;padding:16px;border:1px solid #e0e0e0;border-radius:8px}
    #msg{padding:10px;margin-top:12px;border-radius:6px;white-space:pre-wrap}.ok{background:#e6ffef}.err{background:#ffecec}.info{background:#eef5ff}
    #payment-success{margin-top:16px;padding:14px;border:1px solid #b7ebc6;background:#eafff0;border-radius:8px}
  </style>
</head>
<body>
<div class="container">
  <h1>SecurePay — Demo Store</h1>

  <nav class="row" style="margin-bottom:16px">
    <button id="nav-shop" class="secondary">Shop</button>
    <button id="nav-checkout" class="secondary">Checkout</button>
    <div style="margin-left:auto" id="cart-summary">Cart: 0 items — ₹0.00</div>
  </nav>

  <section id="page-shop">
    <h2>Products</h2>
    <div class="grid" id="products"></div>
    <br><button id="go-to-checkout">Continue to Payment</button>
  </section>

  <section id="page-checkout" class="hidden">
    <div class="checkout-box">
      <h2>Checkout — Your Order</h2>
      <div id="cart-area"></div>

      <h3 style="margin-top:20px">Shipping & Contact</h3>
      <label>Full Name<input id="ship-name" type="text"></label><br>
      <label>Phone<input id="ship-phone" type="tel"></label><br>
      <label>Address<textarea id="ship-address" rows="3"></textarea></label>

      <div class="row" style="margin-top:16px">
        <button id="btn-pay">Pay with PhonePe</button>
        <button id="btn-back" class="secondary">Back to Shop</button>
        <div style="margin-left:auto" id="checkout-total">Total: ₹0.00</div>
      </div>

      <div id="msg" class="hidden"></div>

      <div id="payment-success" class="hidden">
        <h3>✅ Order Complete</h3>
        <div id="payment-success-details"></div>
      </div>
    </div>
  </section>
</div>

<script>
const PRODUCTS=[{id:"p1",name:"Gizmo Basic",price:249},{id:"p2",name:"Widget Pro",price:599},{id:"p3",name:"Thingamajig",price:1299},{id:"p4",name:"Gadget Mini",price:149}];
let CART=JSON.parse(localStorage.getItem("cart")||"[]");
const $=id=>document.getElementById(id),fmt=v=>Number(v).toFixed(2);
const getCookie=n=>{const v=`; ${document.cookie}`.split(`; ${n}=`);return v.length===2?v.pop().split(";").shift():null;}
const getAuthToken=()=>getCookie("securepay_token")||localStorage.getItem("merchant_token")||"";
const qp=(...keys)=>{const q=new URLSearchParams(location.search);for(const k of keys){const v=q.get(k);if(v)return v;}return "";};

function msg(t,type="info"){const el=$("msg");el.className=t?(type==="ok"?"ok":type==="err"?"err":"info"):"hidden";el.textContent=t||"";}
function save(){localStorage.setItem("cart",JSON.stringify(CART));renderSummary();}
function items(){return CART.map(c=>{const p=PRODUCTS.find(x=>x.id===c.product_id);return p?({...p,qty:c.qty,line:p.price*c.qty}):null}).filter(Boolean);}
function total(){return items().reduce((s,i)=>s+i.line,0);}
function add(pid,qty=1){const i=CART.find(x=>x.product_id===pid);i?i.qty+=qty:CART.push({product_id:pid,qty});save();}
function renderSummary(){const n=CART.reduce((s,i)=>s+i.qty,0);$("cart-summary").textContent=`Cart: ${n} items — ₹${fmt(total())}`;$("checkout-total").textContent=`Total: ₹${fmt(total())}`;}
function page(p){$("page-shop").classList.toggle("hidden",p!=="shop");$("page-checkout").classList.toggle("hidden",p!=="checkout");if(p==="shop")renderProducts();else renderCart();}

function renderProducts(){
  $("products").innerHTML=PRODUCTS.map(p=>`<div class="card"><h3>${p.name}</h3><div>₹${fmt(p.price)}</div><div style="margin-top:8px"><input id="q-${p.id}" type="number" min="1" value="1" style="width:60px"><button data-id="${p.id}" style="margin-left:8px">Add</button></div></div>`).join("");
  document.querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>{const id=b.dataset.id,q=parseInt($("q-"+id).value||"1",10);add(id,Math.max(1,q));msg("Added to cart","ok");});
}
function renderCart(){
  const it=items();
  if(!it.length){$("cart-area").innerHTML="<i>Cart empty</i>";renderSummary();return;}
  $("cart-area").innerHTML=`<table><thead><tr><th>Product</th><th>Qty</th><th class="right">Line</th></tr></thead><tbody>${it.map(i=>`<tr><td>${i.name}</td><td><input type="number" min="0" value="${i.qty}" data-pid="${i.id}" style="width:68px"></td><td class="right">₹${fmt(i.line)}</td></tr>`).join("")}</tbody></table>`;
  document.querySelectorAll("input[data-pid]").forEach(inp=>inp.onchange=()=>{const ci=CART.find(x=>x.product_id===inp.dataset.pid);if(ci)ci.qty=Math.max(0,parseInt(inp.value||"0",10));CART=CART.filter(x=>x.qty>0);save();renderCart();});
  renderSummary();
}

async function payNow(){
  if(!CART.length)return msg("Cart is empty","err");
  const name=$("ship-name").value.trim(), phone=$("ship-phone").value.trim(), address=$("ship-address").value.trim();
  if(!name||!phone||!address)return msg("Please fill name, phone and address","err");

  const merchantOrderId=`SP_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
  const amount=Math.round(total()*100);

  // IMPORTANT: send return endpoint, backend verifies and redirects to /merchants/store/?payment_status=...
  const redirectUrl=`${location.origin}/payments/phonepe/return/?merchantOrderId=${encodeURIComponent(merchantOrderId)}`;

  const payload={merchantOrderId,amount,redirectUrl,mobileNumber:phone,customerName:name,customerEmail:"",metadata:{address,cart:CART}};
  msg("Initializing PhonePe payment...","info");
  $("btn-pay").disabled=true; $("btn-pay").textContent="Processing...";

  try{
    const authToken=getAuthToken();
    const headers={"Content-Type":"application/json","X-CSRFToken":getCookie("csrftoken")};
    if(authToken)headers["Authorization"]=`Bearer ${authToken}`;

    const r=await fetch("/payments/phonepe/initiate/",{
      method:"POST",credentials:"include",
      headers,
      body:JSON.stringify(payload)
    });
    const ct=r.headers.get("content-type")||"";
    const d=ct.includes("application/json")?await r.json():{error:await r.text()};
    if(!r.ok){msg("Payment initialization failed.\n"+(d.details||d.error||""),"err");$("btn-pay").disabled=false;$("btn-pay").textContent="Pay with PhonePe";return;}
    if(d.redirectUrl){
      sessionStorage.setItem("sp_merchant_order_id",merchantOrderId);
      if(d.orderId)sessionStorage.setItem("sp_phonepe_order_id",d.orderId);
      location.href=d.redirectUrl; return;
    }
    msg("PhonePe did not return redirectUrl","err");
    $("btn-pay").disabled=false; $("btn-pay").textContent="Pay with PhonePe";
  }catch(e){
    msg("Payment initialization failed.\n"+e.message,"err");
    $("btn-pay").disabled=false; $("btn-pay").textContent="Pay with PhonePe";
  }
}

function showReturnStatus(){
  const status=(qp("payment_status","status","state")||"").toUpperCase();
  if(!status) return;

  page("checkout");

  const merchantOrderId=qp("merchantOrderId")||sessionStorage.getItem("sp_merchant_order_id")||"-";
  const orderId=qp("orderId")||sessionStorage.getItem("sp_phonepe_order_id")||"-";
  const paymentId=qp("paymentId")||"-";
  const amountPaise=qp("amount");
  const amountText=(amountPaise && !isNaN(Number(amountPaise)))?`₹${(Number(amountPaise)/100).toFixed(2)}`:`₹${fmt(total())}`;
  const ok=["SUCCESS","COMPLETED","PAID","SUCCESSFUL"].includes(status);

  $("payment-success").classList.remove("hidden");
  $("payment-success-details").innerHTML=`
    <div><b>Status:</b> ${status}</div>
    <div><b>Merchant Order ID:</b> ${merchantOrderId}</div>
    <div><b>PhonePe Order ID:</b> ${orderId}</div>
    <div><b>Payment ID:</b> ${paymentId}</div>
    <div><b>Amount:</b> ${amountText}</div>
    <div><b>Time:</b> ${new Date().toLocaleString()}</div>
  `;

  if(ok){msg("Payment successful. Order complete.","ok");CART=[];save();renderCart();}
  else msg(`Payment status: ${status}`,"info");

  history.replaceState({}, "", location.pathname);
}

$("nav-shop").onclick=()=>page("shop");
$("nav-checkout").onclick=()=>page("checkout");
$("go-to-checkout").onclick=()=>CART.length?page("checkout"):msg("Cart empty — add items first","err");
$("btn-back").onclick=()=>page("shop");
$("btn-pay").onclick=payNow;

renderProducts(); renderSummary(); page("shop"); showReturnStatus();
</script>
</body>
</html>
